name: smart_lakbay_ios
description: A complete Dart/Flutter reverse engineering of the SmartLakbay application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  go_router: ^14.0.0
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/destinations/
